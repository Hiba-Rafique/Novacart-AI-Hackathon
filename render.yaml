services:
  - type: web
    name: novacart-policyguard
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /readyz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: POLICIES_DIR
        value: /app/policies
      - key: DATA_DIR
        value: /app/data
      - key: INDEX_DIR
        value: /app/data/index
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RAG_TOP_K
        value: "15"
      - key: MODEL_TIMEOUT_SECONDS
        value: "20"
      - key: MAX_MODEL_CONCURRENCY
        value: "3"
