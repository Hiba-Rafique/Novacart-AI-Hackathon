<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaCart PolicyGuard</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #5d687a;
      --line: #d8deea;
      --accent: #0a6b5d;
      --accent-soft: #e6f4f1;
      --warn: #8a4b00;
      --danger: #a12626;
      --paper: #ffffff;
      --canvas: #f4f7f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    .shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
      gap: 12px;
    }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 1.25rem; }
    .tag { color: var(--muted); font-size: .85rem; }
    .notice {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: .9rem;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 0 12px;
    }
    .turn { max-width: 88%; }
    .turn.user { align-self: flex-end; }
    .bubble {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-radius: 12px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .user .bubble { background: var(--accent); color: white; border-color: var(--accent); }
    .meta { margin-top: 6px; color: var(--muted); font-size: .78rem; }
    .status { font-weight: 600; color: var(--accent); }
    .status.PARTIAL { color: var(--warn); }
    .status.NOT_COVERED, .status.CLARIFY { color: var(--muted); }
    .status.ERROR { color: var(--danger); }
    .citation-list { margin-top: 8px; display: grid; gap: 6px; }
    details.citation {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 7px 10px;
    }
    details.citation summary { cursor: pointer; color: var(--accent); }
    .quote { margin-top: 6px; color: var(--muted); font-size: .88rem; white-space: pre-wrap; }
    .calculation { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
    .calculation table { border-collapse: collapse; width: 100%; font-size: .88rem; }
    .calculation td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
    form { display: flex; gap: 8px; position: sticky; bottom: 0; padding-top: 8px; background: var(--canvas); }
    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      color: inherit;
      background: var(--paper);
    }
    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 10px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--accent); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .actions { display: flex; gap: 8px; }
    @media (max-width: 560px) {
      .turn { max-width: 100%; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>NovaCart PolicyGuard</h1>
      <span class="tag">Policy-only assistant</span>
    </header>
    <p class="notice">
      Answers use only the supplied NovaCart policy files. Dates must come from your question;
      the server clock is never used to infer an order or delivery date.
    </p>
    <section id="chat" aria-live="polite" aria-label="Conversation"></section>
    <form id="ask-form">
      <label for="question" hidden>Your question</label>
      <textarea id="question" name="question" maxlength="2000" required
        placeholder="Ask about shipping, returns, refunds, warranty, promo codes or payments"></textarea>
      <div class="actions">
        <button id="send" type="submit">Send</button>
        <button id="reset" class="secondary" type="button">New question</button>
      </div>
    </form>
  </main>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const send = document.getElementById("send");
    const reset = document.getElementById("reset");
    let conversation = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function addTurn(role, content) {
      const turn = el("div", "turn " + role);
      const bubble = el("div", "bubble", content);
      turn.appendChild(bubble);
      chat.appendChild(turn);
      chat.scrollTop = chat.scrollHeight;
      return turn;
    }

    function addPending() {
      const turn = el("div", "turn assistant");
      turn.appendChild(el("div", "bubble", "Checking the policy files..."));
      chat.appendChild(turn);
      chat.scrollTop = chat.scrollHeight;
      return turn;
    }

    function renderAnswer(turn, data) {
      turn.replaceChildren();
      const bubble = el("div", "bubble", data.answer);
      turn.appendChild(bubble);

      const meta = el("div", "meta");
      meta.appendChild(el("span", "status " + data.status, data.status));
      meta.appendChild(document.createTextNode(" · contact date " + data.resolved_contact_date));
      turn.appendChild(meta);

      if (data.calculation) {
        const box = el("div", "calculation");
        box.appendChild(el("strong", "", "Calculation"));
        const table = el("table");
        for (const step of data.calculation.steps) {
          const row = el("tr");
          row.appendChild(el("td", "", step.description));
          row.appendChild(el("td", "", step.value + " " + data.calculation.currency));
          table.appendChild(row);
        }
        box.appendChild(table);
        turn.appendChild(box);
      }

      if (data.citations && data.citations.length) {
        const list = el("div", "citation-list");
        for (const citation of data.citations) {
          const details = el("details", "citation");
          details.appendChild(el("summary", "", citation.filename + " — Section " + citation.section));
          details.appendChild(el("div", "quote", citation.heading + "\n" + citation.supporting_quote));
          list.appendChild(details);
        }
        turn.appendChild(list);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function renderError(turn, message) {
      turn.replaceChildren();
      turn.appendChild(el("div", "bubble", message));
      turn.appendChild(el("div", "meta status ERROR", "ERROR"));
      chat.scrollTop = chat.scrollHeight;
    }

    async function ask(question) {
      addTurn("user", question);
      const pending = addPending();
      send.disabled = true;
      input.disabled = true;
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 45000);
        const response = await fetch("/api/v1/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, conversation }),
          signal: controller.signal,
        });
        clearTimeout(timer);
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          const message = payload && payload.error
            ? payload.error.message
            : "The assistant is temporarily unavailable.";
          renderError(pending, message);
          return;
        }
        conversation = payload.conversation;
        renderAnswer(pending, payload);
        if (payload.status === "CLARIFY" && payload.clarifying_question) {
          input.placeholder = payload.clarifying_question;
        }
      } catch (error) {
        renderError(pending, error.name === "AbortError"
          ? "The request timed out. Please retry."
          : "The assistant could not be reached. Please retry.");
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = "";
      ask(question);
    });

    reset.addEventListener("click", () => {
      conversation = null;
      chat.replaceChildren();
      input.placeholder = "Ask about shipping, returns, refunds, warranty, promo codes or payments";
      input.focus();
    });
  </script>
</body>
</html>
